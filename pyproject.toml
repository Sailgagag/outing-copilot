[project]
name = "outing-copilot"
version = "0.1.0"
description = "An MCP server (Streamable HTTP) that tells Alexa+ users the best time to go outside, chaining five free public APIs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
outing-copilot = "outing_copilot.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
